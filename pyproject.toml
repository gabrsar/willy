[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "willy"
version = "0.1.10"
description = "Local-first Git sync for OrcaSlicer profiles."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
  { name = "Gabriel Saraiva", email = "extremez3r0@gmail.com" },
]
keywords = ["orcaslicer", "3d-printing", "git", "sync", "tray"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]
dependencies = [
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
  "pillow>=10.0; sys_platform == 'win32'",
  "PySide6>=6.8; sys_platform == 'win32'",
  "pystray>=0.19; sys_platform == 'win32'",
  "typer>=0.12",
  "watchdog>=6.0",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0; sys_platform == 'win32'",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
willy = "willy.cli:main"

[project.urls]
Homepage = "https://github.com/gabrsar/willy"
Issues = "https://github.com/gabrsar/willy/issues"
Source = "https://github.com/gabrsar/willy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
